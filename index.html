<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="description" content="把今天的一筆消費，換算成 5、10、20、30 年後可能累積的資產。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <title>消費機會成本計算器</title>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">一筆消費，另一種可能</p>
      <h1>消費機會成本</h1>
      <p class="intro">今天花的這筆錢，<br>如果拿去投資，未來可能是多少？</p>
    </header>
    <section class="calculator" aria-label="試算設定">
      <div class="field">
        <label for="amount">現在要花的金額</label>
        <div class="input-wrap"><span aria-hidden="true">NT$</span><input id="amount" type="number" inputmode="decimal" min="0" step="any" value="800000" aria-describedby="amount-error"><span class="sr-only">新臺幣</span></div>
        <p class="message" id="amount-error" aria-live="polite" hidden></p>
      </div>
      <div class="field">
        <label for="rate">假設年化報酬率</label>
        <div class="input-wrap rate-wrap"><input id="rate" type="number" inputmode="decimal" step="0.1" value="6" aria-describedby="rate-hint rate-error"><span aria-hidden="true">%</span></div>
        <div class="quick-rates" aria-label="快速報酬率">
          <button type="button" data-rate="4" aria-pressed="false">4%</button>
          <button type="button" data-rate="6" aria-pressed="true" class="selected">6%</button>
          <button type="button" data-rate="8" aria-pressed="false">8%</button>
          <button type="button" data-rate="10" aria-pressed="false">10%</button>
        </div>
        <p class="hint" id="rate-hint">可自行輸入，建議範圍 0–20%。</p>
        <p class="message" id="rate-error" aria-live="polite" hidden></p>
      </div>
    </section>
    <section class="results-section" aria-labelledby="results-heading">
      <div class="section-heading"><h2 id="results-heading">如果留給未來</h2><span>每年複利計算</span></div>
      <div id="results" class="results" aria-live="polite" aria-atomic="true"></div>
      <noscript><p>請啟用 JavaScript 以使用即時計算功能。</p></noscript>
    </section>
    <section class="explanation" aria-label="關於這個工具">
      <h2>這不是告訴你不能花錢。</h2>
      <p>這個工具只是把今天的一筆消費，<br>換算成未來可能放棄的資產。</p>
      <p>知道這個價格後，<br>再決定現在的體驗是否值得交換。</p>
    </section>
    <footer>
      <p>本工具僅提供複利情境試算，不代表實際投資報酬。</p>
      <p>實際市場報酬具有不確定性，且本計算未考慮通膨、稅負、交易成本與投資風險。</p>
    </footer>
  </main>
</body>
</html>
